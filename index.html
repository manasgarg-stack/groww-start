<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Groww Start - Gen Z investing prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF1; --surface:#FFFFFF; --surface2:#F1F4F7; --ink:#14172A; --ink2:#566078; --line:#E0E6EC;
  --mint:#00D09C; --mintink:#007A5E; --mintsoft:#D9F6EC; --blue:#4B5DFF; --bluesoft:#E6E9FF;
  --amber:#B86F0E; --ambersoft:#FFF0D9; --bad:#D8383E; --badsoft:#FFE4E5;
  --hero:#171A2B; --frame:#14172A; --tz:1;
  --fd:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fb:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  font-size:calc(15px * var(--tz,1));
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0D16; --surface:#141725; --surface2:#1C2030; --ink:#F1F3F9; --ink2:#9CA4BD; --line:#2A3046;
    --mintink:#2EE6B8; --mintsoft:#0F3A31; --blue:#8D99FF; --bluesoft:#232A55;
    --amber:#F0A94B; --ambersoft:#3A2A10; --bad:#FF7A80; --badsoft:#3B1A1C;
    --hero:#20253D; --frame:#2A3046;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0D16; --surface:#141725; --surface2:#1C2030; --ink:#F1F3F9; --ink2:#9CA4BD; --line:#2A3046;
  --mintink:#2EE6B8; --mintsoft:#0F3A31; --blue:#8D99FF; --bluesoft:#232A55;
  --amber:#F0A94B; --ambersoft:#3A2A10; --bad:#FF7A80; --badsoft:#3B1A1C;
  --hero:#20253D; --frame:#2A3046;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.45 var(--fb);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
h1,h2,h3,h4{font-family:var(--fd);margin:0;letter-spacing:-.02em;line-height:1.12}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.13rem;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.fine{font-size:.8rem;color:var(--ink2);line-height:1.4}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:10px}
html.rm *{animation:none!important;transition:none!important}
html.ld .spark{display:none}
html.ld .confetti{display:none}

.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px}
.phone{position:relative;width:100%;height:100%;background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:520px){
  .phone{width:404px;height:min(880px,calc(100% - 32px));border-radius:44px;border:9px solid var(--frame);box-shadow:0 30px 80px rgba(10,12,30,.30)}
}
.notes{display:none}
@media (min-width:1020px){
  .notes{display:block;width:390px;max-height:calc(100% - 32px);overflow:auto;padding:6px 4px}
}
.app{display:flex;flex-direction:column;height:100%;min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px;gap:8px}
.top .hi{font-family:var(--fd);font-weight:800;font-size:1.33rem;letter-spacing:-.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.daychip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.85rem;white-space:nowrap}
.iconbtn{position:relative;width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
.iconbtn .dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:.67rem;display:grid;place-items:center;padding:0 4px;font-weight:700}
.view{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 22px;display:flex;flex-direction:column;gap:14px}
.view>*,.ob>*{flex:none}
.ob>.grow{flex:1 1 0;min-height:0}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 6px 8px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:.73rem;font-weight:500;color:var(--ink2);border-radius:12px}
.nav button[aria-current="page"]{color:var(--mintink);font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:16px;font-weight:700;text-align:center}
.btn.primary{background:var(--mint);color:#06241D}
.btn.dark{background:var(--ink);color:var(--surface)}
.btn.soft{background:var(--surface2)}
.btn.line{border:1.5px solid var(--line)}
.btn.bad{background:var(--badsoft);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;border-radius:12px;font-size:.93rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.card{background:var(--surface2);border-radius:20px;padding:16px}
.card.line{background:var(--surface);border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;background:var(--surface2);font-weight:600;font-size:.93rem;border:1.5px solid transparent}
.chip[aria-pressed="true"],.chip.on{background:var(--mintsoft);border-color:var(--mint);color:var(--mintink)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-weight:700;font-size:.8rem;white-space:nowrap}
.pill.good{background:var(--mintsoft);color:var(--mintink)}
.pill.warn{background:var(--ambersoft);color:var(--amber)}
.pill.bad{background:var(--badsoft);color:var(--bad)}
.pill.info{background:var(--bluesoft);color:var(--blue)}
.pill.mute{background:var(--surface2);color:var(--ink2)}
.up{color:var(--mintink)} .down{color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600}
.field input[type=text],.field input[type=number],.field textarea{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;min-height:50px;padding:0 14px;font-size:1.13rem;font-weight:600;width:100%}
.field textarea{padding:12px 14px;min-height:96px;font-size:1rem;font-weight:400;resize:vertical}
input[type=range]{width:100%;accent-color:var(--mint);height:32px}
.switch{position:relative;width:50px;height:30px;border-radius:999px;background:var(--line);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--mint)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.divider{height:1px;background:var(--line);border:0;margin:2px 0}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px;overflow-x:auto}
.seg button{flex:1;white-space:nowrap;padding:8px 12px;border-radius:10px;font-weight:700;font-size:.87rem;text-align:center;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.term{text-decoration:underline dotted;text-underline-offset:3px;font-weight:inherit}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x proximity}
.hscroll>*{flex:none;scroll-snap-align:start}
.banner{padding:10px 14px;border-radius:14px;font-weight:600;font-size:.87rem;display:flex;gap:10px;align-items:center}
.banner.bad{background:var(--badsoft);color:var(--bad)}
.banner.warn{background:var(--ambersoft);color:var(--amber)}
.banner.info{background:var(--bluesoft);color:var(--blue)}
.tick{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.87rem;font-weight:800;flex:none;background:var(--line);color:var(--ink2)}
.tick.ok{background:var(--mint);color:#06241D}
.tick.no{background:var(--badsoft);color:var(--bad)}
.link{color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.ob{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 22px;display:flex;flex-direction:column;gap:16px}
.dots{display:flex;gap:6px;align-items:center}
.dots i{height:5px;flex:1;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--mint)}
.backbtn{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
.tile{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--surface2);border:1.5px solid transparent;width:100%}
.tile[aria-pressed="true"]{background:var(--mintsoft);border-color:var(--mint)}
.tile[disabled]{opacity:.5}
.tile .em{font-size:1.73rem;width:46px;height:46px;border-radius:14px;background:var(--surface);display:grid;place-items:center;flex:none}
.tile b{display:block;font-size:1.07rem}
.tile span.s{font-size:.87rem;color:var(--ink2)}
.hero-art{display:grid;place-items:center;padding:14px 0 0}
.kyc-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kyc-row:last-child{border:0}

.goalcard{background:var(--hero);color:#fff;border-radius:28px;padding:18px;display:flex;gap:14px;align-items:center}
.goalcard .meta{flex:1;min-width:0}
.goalcard h2{font-size:1.4rem;color:#fff}
.goalcard .amt{font-size:1rem;color:#C5CBE0;margin-top:4px}
.goalcard .amt b{color:#fff;font-size:1.2rem}
.goalcard .pill{margin-top:10px}
.goalcard .pill.good{background:rgba(0,208,156,.18);color:#4DF0C4}
.goalcard .pill.warn{background:rgba(240,169,75,.2);color:#F6B964}
.goalnote{font-size:.87rem;color:#C5CBE0;margin-top:8px}
.mini{width:158px;padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.mini .e{font-size:1.5rem}
.mini b{font-size:.95rem}
.mini.add{align-items:center;justify-content:center;color:var(--mintink);border-style:dashed;text-align:center}
.big{font-family:var(--fd);font-weight:800;font-size:2.3rem;letter-spacing:-.03em}
.spark{width:100%;height:96px;display:block}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

.nudge{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.nudge .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;font-size:1.33rem;background:var(--mintsoft)}
.nudge.warn .ic{background:var(--ambersoft)}
.nudge.info .ic{background:var(--bluesoft)}
.nudge h3{font-size:1.07rem}
.nudge p{font-size:.93rem;color:var(--ink2);margin:3px 0 8px}
.why{font-size:.75rem;color:var(--ink2);margin-top:8px}
.weeks{display:flex;gap:8px}
.weeks i{flex:1;aspect-ratio:1;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.73rem;color:var(--ink2);font-weight:700}
.weeks i.on{background:var(--mint);border-color:var(--mint);color:#06241D}
.weeks i.now{border-color:var(--ink);border-style:dashed}
.meter{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.meter i{height:8px;border-radius:5px;background:var(--line)}
.meter i.f1{background:#00D09C}.meter i.f2{background:#79D86B}.meter i.f3{background:#E9C13A}.meter i.f4{background:#F08A3C}
.meter i.lock{background:repeating-linear-gradient(135deg,var(--line) 0 4px,transparent 4px 8px)}

.lot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lot:last-child{border-bottom:0}
button.lot{width:100%}
.asset{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--surface2);width:100%}
.asset .em{width:42px;height:42px;border-radius:13px;background:var(--surface);display:grid;place-items:center;font-size:1.4rem;flex:none}
.asset .spk{width:70px;height:34px;flex:none}
.lesson{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--surface2);width:100%}
.lesson .em{width:44px;height:44px;border-radius:14px;background:var(--surface);display:grid;place-items:center;font-size:1.47rem;flex:none}
.lesson .done{margin-left:auto}
.metric{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.metric:last-child{border:0}
.log{font-size:.83rem;color:var(--ink2);display:flex;gap:8px;padding:5px 0}
.log b{color:var(--ink);font-weight:700}
.rowlink{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%}
.rowlink:last-child{border:0}
.rowlink .e{width:38px;height:38px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:1.2rem;flex:none}
.rowlink .t{flex:1;min-width:0}
.rowlink .t b{display:block}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 8px;border-radius:18px;background:var(--surface2)}
.badge .e{font-size:1.9rem}
.badge.locked{opacity:.45;filter:grayscale(1)}
.badge b{font-size:.8rem;line-height:1.2}
.badge span{font-size:.7rem;color:var(--ink2);line-height:1.25}
.notif{display:flex;gap:12px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.notif.unread{border-color:var(--mint);background:var(--mintsoft)}
.notif .ic{font-size:1.3rem;width:36px;height:36px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;flex:none}
.notif b{display:block}
.tl{display:flex;flex-direction:column;gap:0}
.tl>div{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl>div:last-child{padding-bottom:0}
.tl>div::before{content:"";position:absolute;left:12px;top:26px;bottom:0;width:2px;background:var(--line)}
.tl>div:last-child::before{display:none}
details.acc{background:var(--surface2);border-radius:16px;padding:0 14px}
details.acc summary{padding:14px 0;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font-weight:400;font-size:1.3rem;line-height:1}
details.acc[open] summary::after{content:"\2212"}
details.acc p{padding:0 0 14px;color:var(--ink2);font-size:.93rem}
.sbar{display:flex;align-items:center;gap:10px;font-size:.87rem}
.sbar .lab{width:92px;flex:none;color:var(--ink2)}
.sbar .trk{flex:1;height:18px;border-radius:6px;background:var(--surface2);overflow:hidden}
.sbar .trk i{display:block;height:100%}
.sbar .val{width:44px;text-align:right;font-weight:700}
table.tbl{width:100%;border-collapse:collapse;font-size:.83rem}
table.tbl th,table.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.tbl th{color:var(--ink2);font-weight:700}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.kv span:first-child{color:var(--ink2)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;background:var(--surface2);padding:10px;border-radius:12px;overflow:auto;max-height:200px;white-space:pre-wrap;word-break:break-all}

.scrim{position:absolute;inset:0;background:rgba(10,12,30,.5);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--surface);width:100%;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:18px 18px 24px;display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.sheet>*{flex:none}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--line);align-self:center;margin-top:-6px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:16px;z-index:30;font-weight:600;font-size:.93rem;animation:up .2s ease-out}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:15}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s ease-in forwards}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fall{to{transform:translateY(900px) rotate(540deg);opacity:.9}}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--mint);animation:spin .8s linear infinite;flex:none}
.spinner.sm{width:22px;height:22px;border-width:3px}
.grow-in{animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 100%}
@keyframes grow{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}

.notes h2{font-size:1.75rem;margin-bottom:6px}
.notes h3{margin:18px 0 6px;font-size:1.07rem}
.notes p,.notes li{color:var(--ink2);font-size:.93rem}
.notes ul,.notes ol{padding-left:18px;margin:6px 0;display:flex;flex-direction:column;gap:5px}
.notes .tag{display:inline-block;background:var(--mintsoft);color:var(--mintink);font-weight:700;font-size:.8rem;padding:4px 10px;border-radius:999px;margin-bottom:10px}
.notes .box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
</style>
</head>
<body>
<div class="stage">
  <aside class="notes" id="notes" aria-label="About this prototype"></aside>
  <div class="phone"><div class="app" id="app"></div><div id="layer"></div></div>
</div>
<script>
(function(){
'use strict';
/* ================= helpers ================= */
const $=(s,el)=>(el||document).querySelector(s);
const fmt=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const fmtS=n=>(n<0?'-':'')+fmt(Math.abs(n));
const fmt2=n=>'₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(n,d=1)=>(n>=0?'+':'')+n.toFixed(d)+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>Math.random().toString(36).slice(2,8);
const sum=a=>a.reduce((x,y)=>x+y,0);
const DAYMS=864e5;

/* ================= seeded market simulation ================= */
const HORIZON=1100,MAXDAY=1000;
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function series(seed,drift,vol,shock){
  const r=rng(seed),out=[100],mu=drift/365,sg=vol/Math.sqrt(365);
  for(let d=1;d<=HORIZON;d++){
    let ret=mu-0.5*sg*sg+sg*gauss(r);
    if(shock){
      if(d>=shock.from&&d<=shock.to)ret+=shock.total/(shock.to-shock.from+1);
      if(shock.rec&&d>shock.to&&d<=shock.to+shock.rec.days)ret+=shock.rec.total/shock.rec.days;
    }
    out.push(out[d-1]*Math.exp(ret));
  }
  return out;
}

const goalById=id=>S.goals.find(g=>g.id===id);
const focusGoal=()=>goalById(S.focus)||S.goals[0]||null;

function unitsAt(l,d){let u=l.units0;for(const s of l.sells)if(s.day<=d)u-=s.units;return Math.max(0,u)}
function lotValueAt(l,d){if(d<l.day)return 0;const u=unitsAt(l,d);return d<l.alloc?l.amount0*u/l.units0:u*nav(l.basket,d)}
function lotCostAt(l,d){if(d<l.day)return 0;return l.amount0*unitsAt(l,d)/l.units0}
const goalLots=gid=>S.lots.filter(l=>l.goal===gid);
const gValue=(gid,d)=>sum(goalLots(gid).map(l=>lotValueAt(l,d==null?S.day:d)));
const gCost=(gid,d)=>sum(goalLots(gid).map(l=>lotCostAt(l,d==null?S.day:d)));
const tValue=d=>sum(S.lots.map(l=>lotValueAt(l,d==null?S.day:d)));
const tCost=d=>sum(S.lots.map(l=>lotCostAt(l,d==null?S.day:d)));
const gUnits=gid=>sum(goalLots(gid).map(l=>unitsAt(l,S.day)));
const gWithdrawable=gid=>sum(goalLots(gid).filter(l=>l.alloc<=S.day).map(l=>unitsAt(l,S.day)*nav(l.basket,S.day)));
const gPending=gid=>sum(goalLots(gid).filter(l=>l.alloc>S.day).map(l=>lotValueAt(l,S.day)));

/* ================= analytics & notifications ================= */
const ESSENTIAL=new Set(['first_investment','investment','second_investment','withdrawal','kyc_done','sip_setup','goal_created']);
function track(name,props){
  if(!S.consent.analytics&&!ESSENTIAL.has(name))return;
  S.events.push({name:name,day:S.day,ts:Date.now(),props:props||{}});
  if(S.events.length>400)S.events.shift();
}
function notify(cat,title,body,act){
  const week=Math.floor(S.day/7);
  if(cat!=='txn'){
    if(S.np[cat]===false){S.stats.notifOff++;return false}
    const used=S.notifs.filter(n=>n.cat!=='txn'&&n.week===week).length;
    if(used>=S.np.cap){S.stats.notifCapped++;return false}
  }
  S.notifs.unshift({id:uid(),cat:cat,title:title,body:body,act:act||null,day:S.day,week:week,read:false});
  if(S.notifs.length>60)S.notifs.length=60;
  return true;
}
function earn(id){
  if(S.badges[id]!=null)return;
  S.badges[id]=S.day;
  const b=BADGES.find(x=>x.id===id);
  notify('txn','Badge earned: '+b.title,b.desc,{a:'badges',x:''});
  track('badge_earned',{id:id});
  UI.badgeNote=b.emoji+' Badge earned: '+b.title;
}
function checkBadges(){
  if(S.lots.length)earn('seed');
  if(S.goals.some(g=>g.sip.on))earn('auto');
  if(S.ro.total>0)earn('spare');
  const st=streak();if(st.n>=3)earn('s3');if(st.n>=8)earn('s8');
  if(S.learn.done.length>=3)earn('curious');
  if(S.events.some(e=>e.name==='practice_to_real'))earn('grad');
  if(S.dipFirstDay!=null&&S.day-S.dipFirstDay>=14&&!S.outs.some(o=>o.day>=S.dipFirstDay))earn('dip');
  if(S.goals.some(g=>gValue(g.id)>=g.target*.25))earn('quarter');
  if(S.goals.some(g=>gValue(g.id)>=g.target))earn('goal');
  if(S.ref.shared>0)earn('invite');
}

/* ================= goals, orders, withdrawals ================= */
function createGoal(d,basketId){
  const g={id:'g'+uid(),type:d.id,emoji:d.emoji,title:d.title,target:d.target,months:d.months,basketId:basketId,created:S.day,
    sip:{on:false,amount:500,nextDay:null,paused:false,skipNext:false,limit:0}};
  S.goals.push(g);if(!S.focus)S.focus=g.id;
  track('goal_created',{type:g.type,target:g.target,months:g.months,basket:basketId});
  return g;
}
function invest(goalId,amount,src){
  const g=goalById(goalId);amount=Math.round(amount);
  if(!g||!(amount>0))return null;
  const alloc=S.day+1,units=amount/nav(g.basketId,alloc);
  const l={id:'GS'+uid().toUpperCase(),goal:goalId,basket:g.basketId,day:S.day,alloc:alloc,amount0:amount,units0:units,sells:[],src:src,ts:Date.now()};
  S.lots.push(l);
  const n=S.lots.length;
  if(n===1)track('first_investment',{amount:amount,src:src,ms:Date.now()-S.t0});
  else track('investment',{amount:amount,src:src});
  if(n===2)track('second_investment',{daysSinceFirst:S.day-S.lots[0].day,within30:(S.day-S.lots[0].day)<=30});
  if(S.practice.trades.length&&!S.events.some(e=>e.name==='practice_to_real'))track('practice_to_real',{});
  notify('txn','Order placed: '+fmt(amount),'Into '+g.title+'. Units are allotted on '+dLabel(alloc)+'.',{a:'order-open',x:l.id});
  save();return l;
}
function redeem(goalId,amount){
  const n=S.day;let need=amount,got=0;
  const lots=goalLots(goalId).filter(l=>l.alloc<=n&&unitsAt(l,n)>1e-9).sort((a,b)=>a.day-b.day);
  for(const l of lots){
    if(need<=0.005)break;
    const u=unitsAt(l,n),v=u*nav(l.basket,n),take=Math.min(v,need);
    const un=take>=v-0.005?u:take/nav(l.basket,n);

function weeksSet(){const m={};S.lots.forEach(l=>{m[Math.floor(l.day/7)]=1});return Object.keys(m).map(Number).sort((a,b)=>a-b)}
function streak(){
  const ws=weeksSet();if(!ws.length)return{n:0,alive:false,risk:false,set:{}};
  const grace=S.irregular?1:0,cw=Math.floor(S.day/7),last=ws[ws.length-1],set={};ws.forEach(w=>{set[w]=1});
  if(cw-last>1+grace)return{n:0,alive:false,risk:false,set:set};
  let n=1;for(let i=ws.length-1;i>0;i--){if(ws[i]-ws[i-1]<=1+grace)n++;else break}
  return{n:n,alive:true,risk:(cw>last&&(S.day%7)>=4),set:set};
}
function monthsLeft(g){return Math.max(.5,g.months-(S.day-g.created)/30)}
function gStatus(g){
  const cur=gValue(g.id),mLeft=monthsLeft(g),need=Math.max(0,(g.target-cur)/mLeft);
  let planned=g.sip.on&&!g.sip.paused?g.sip.amount:0;
  if(S.ro.on&&S.ro.goal===g.id&&S.day>0)planned+=S.ro.total/Math.max(1,S.day/30);
  const st=cur>=g.target?'done':(planned>=need*.95||need<1?'on':'behind');
  return{cur:cur,mLeft:mLeft,need:need,planned:planned,st:st,p:clamp(cur/g.target,0,1)};
}
function recommendFor(months,gtype){

  const h=months<=9?'a short runway, so stability comes first':months<=18?'under 18 months, so mostly steady with a little growth':months<=36?'around 2 to 3 years, which leaves room for some growth':'a long runway, so there is time to ride out dips';
  rs.push('Your goal is about '+Math.round(months)+' months away: '+h+'.');
  const cap={sell:2,wait:3,buy:4}[P.comfort]||2;
  if(cap<r){r=cap;rs.push('A 10% dip would make you uneasy, so we turned the risk down a notch.')}

  const cushion=P.emergency==='yes'||S.goals.some(g=>g.type==='emergency'&&gValue(g.id)>=g.target*.5);
  if(!cushion&&gtype!=='emergency'&&r>2){r=2;rs.push('You do not have an emergency cushion yet, so we keep risk low until you build one.')}

function allocPlan(total){
  const act=S.goals.filter(g=>gStatus(g).st!=='done');if(!act.length)return[];

    if(S.flags.streaks&&streak().risk&&d%7===4)notify('reminder','Your streak ends soon','Add ₹50 before the week ends to keep it alive.',{a:'quick50',x:''});

function pTrade(id,side,amt){
  const a=ASSETS.find(x=>x.id===id),P=S.practice,px=pPrice(a);amt=Math.round(amt);
  if(!(amt>0))return'Enter an amount first.';
  if(side==='buy'){
    if(amt>P.cash)return'You only have '+fmt(P.cash)+' of practice cash.';
    P.cash-=amt;P.pos[id]=(P.pos[id]||0)+amt/px;P.cost[id]=(P.cost[id]||0)+amt;
  }else{

function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+.3275911*x);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return s*y}

  return Math.ceil(Math.pow(za+zb,2)*(p1*(1-p1)+p2*(1-p2))/Math.pow(mde,2));
}
function runExperiment(){
  const E=UI.exp,p0=E.base/100,mde=E.mde/100,lift=E.lift/100,n=Math.min(sampleSize(p0,mde,E.power),30000);
  S.stats.expRuns++;const r=rng(1000+S.stats.expRuns*17);
  let c=0,t=0;for(let i=0;i<n;i++){if(r()<p0)c++;if(r()<p0+lift)t++}
  const pc=c/n,pt=t/n,diff=pt-pc,se=Math.sqrt(pc*(1-pc)/n+pt*(1-pt)/n),z=diff/se,p=2*(1-normCdf(Math.abs(z)));
  let dec;
  if(E.breach)dec={k:'bad',t:'Hold: a guardrail was breached (simulated). Investigate before shipping.'};
  else if(p<.05&&diff>=mde)dec={k:'good',t:'Ship it: significant and above the minimum effect.'};
  else if(p<.05&&diff>0)dec={k:'warn',t:'Real but small: below the lift we care about. Iterate before scaling.'};
  else dec={k:'warn',t:'Inconclusive: extend the test or stop. Do not ship on a hunch.'};
  E.res={n:n,pc:pc,pt:pt,diff:diff,lo:diff-1.96*se,hi:diff+1.96*se,p:p,dec:dec};
  track('experiment_run',{n:n,diff:+diff.toFixed(4)});save();
}

  return `<svg viewBox="0 0 120 120" width="${size||112}" height="${size||112}" role="img" aria-label="Basket allocation">${segs}</svg>`;
}
function meter(risk){let s='';for(let i=1;i<=6;i++)s+=`<i class="${i<=risk?'f'+i:(i>=5?'lock':'')}"></i>`;return `<div class="meter" role="img" aria-label="Risk level ${risk} of 6. Levels 5 and 6 are not offered in Start.">${s}</div>`}
function plant(p,sz){
  p=clamp(p,0,1);const h=14+62*p,top=100-h;let s='';
  s+='<ellipse cx="60" cy="102" rx="34" ry="7" style="fill:#2B3050"/>';
  s+=`<path d="M60 100 C60 ${100-h*.5} 60 ${top+8} 60 ${top}" fill="none" stroke="#2EE6B8" stroke-width="4" stroke-linecap="round"/>`;
  const lf=(x,y,rot,sc,c)=>`<ellipse cx="${x}" cy="${y}" rx="${13*sc}" ry="${6.5*sc}" transform="rotate(${rot} ${x} ${y})" fill="${c}"/>`;
  s+=lf(50,top+6,-35,.55+p*.5,'#00D09C')+lf(70,top+4,35,.55+p*.5,'#00D09C');
  if(p>.2)s+=lf(48,top+h*.42,-28,.9,'#4DF0C4')+lf(72,top+h*.5,28,.9,'#4DF0C4');
  if(p>.5)s+=lf(47,top+h*.72,-25,1,'#00B386')+lf(73,top+h*.78,25,1,'#00B386');
  if(p>.8)s+=`<circle cx="60" cy="${top-6}" r="${10+8*(p-.8)/.2}" fill="#00D09C" opacity=".92"/>`;
  if(p>=1)s+=`<circle cx="60" cy="${top-6}" r="14" fill="#F6B964"/><text x="60" y="${top-1}" text-anchor="middle" font-size="15" font-weight="800" fill="#171A2B" font-family="sans-serif">₹</text>`;
  const w=sz||112;
  return `<svg viewBox="0 0 120 112" width="${w}" height="${Math.round(w*.93)}" class="grow-in" role="img" aria-label="Goal plant, ${Math.round(p*100)}% grown">${s}</svg>`;
}
function ring(p,inner){
  const r=54,c=2*Math.PI*r;
  return `<div style="position:relative;width:132px;height:132px;flex:none"><svg viewBox="0 0 132 132" width="132" height="132" style="position:absolute;inset:0"><circle cx="66" cy="66" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="8"/><circle cx="66" cy="66" r="${r}" fill="none" stroke="#00D09C" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 66 66)"/></svg><div style="position:absolute;inset:0;display:grid;place-items:center;padding-top:6px">${inner}</div></div>`;
}
function gauge(score){
  const L=Math.PI*50,col=score<35?'var(--bad)':score<60?'#E9C13A':'var(--mint)';
  return `<svg viewBox="0 0 120 72" width="104" height="62" role="img" aria-label="Money health ${score} out of 100"><path d="M10 62 A50 50 0 0 1 110 62" fill="none" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/><path d="M10 62 A50 50 0 0 1 110 62" fill="none" style="stroke:${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(L*score/100).toFixed(1)} ${L.toFixed(1)}"/><text x="60" y="58" text-anchor="middle" font-size="26" font-weight="800" style="fill:var(--ink)" font-family="sans-serif">${score}</text></svg>`;
}
function projChart(p,target){
  const w=300,h=130,pad=8,n=p.exp.length,mx=Math.max(target,p.high[n-1])*1.06,mn=0;
  const X=i=>pad+(w-2*pad)*i/(n-1),Y=v=>h-pad-(h-2*pad)*((v-mn)/(mx-mn||1));
  const line=a=>a.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const band=p.high.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ')+' '+p.low.map((v,i)=>[X(i),Y(p.low[i])]).reverse().map(a=>'L'+a[0].toFixed(1)+' '+a[1].toFixed(1)).join(' ')+' Z';
  return `<svg class="spark" style="height:130px" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Projected goal value range"><path d="${band}" style="fill:var(--mint);fill-opacity:.18"/><line x1="${pad}" x2="${w-pad}" y1="${Y(target).toFixed(1)}" y2="${Y(target).toFixed(1)}" style="stroke:var(--blue)" stroke-width="1.6" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/><path d="${line(p.exp)}" fill="none" style="stroke:var(--mint)" stroke-width="2.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

  const from=S.lots[0].day,days=[];for(let d=from;d<=S.day;d++)days.push(d);
  const dd=ds(days,90);
  return spark(dd.map(d=>tValue(d)),{base:dd.map(d=>tCost(d)),label:'Portfolio value versus money invested'})+'<div class="legend"><span><i style="background:var(--mint)"></i>Value</span><span><i style="background:var(--ink2)"></i>You invested</span></div>';
}
function tabHome(){

  let recapC='';

function tabGoals(){
  if(!S.goals.length)return `<div class="card line stack" style="text-align:center;align-items:center"><div class="hero-art" style="padding:0">${plant(.1,96)}</div><h2>No goals yet</h2><p class="muted">Goals turn "someday" into a number, a date and a plan.</p><button class="btn primary block" data-act="newgoal">Create a goal</button></div>`;

function goalDetail(g){
  const s=gStatus(g),b=BASKETS[g.basketId],pj=project(g),n=pj.months,sip=g.sip;
  const val=gValue(g.id),cost=gCost(g.id),gain=val-cost,units=gUnits(g.id),pend=gPending(g.id),cnav=nav(g.basketId,S.day);
  const endE=pj.exp[n],endL=pj.low[n],endH=pj.high[n];
  const verdict=endL>=g.target?{k:'good',t:'Very likely to reach your target on this plan.'}:endE>=g.target?{k:'good',t:'Likely to reach your target on this plan, though markets can surprise.'}:endH>=g.target?{k:'warn',t:'Only an optimistic market gets you there. Consider a bigger SIP or a later date.'}:{k:'bad',t:'Unlikely on this plan. Raise your monthly amount or extend the deadline.'};
  const held={};goalLots(g.id).forEach(l=>{held[l.basket]=(held[l.basket]||0)+lotValueAt(l,S.day)});
  const holds=Object.keys(held).map(k=>`<div class="lot"><span>${BASKETS[k].emoji} ${BASKETS[k].name}</span><b class="num">${fmt(held[k])}</b></div>`).join('')||'<p class="muted">Nothing here yet.</p>';

  const rl=S.ro.on&&S.ro.goal===g.id?`<div class="fine">🪙 Round-ups are feeding this goal (${fmt(S.ro.total)} so far).</div>`:'';
  const ord=orderList().filter(o=>o.goal===g.id).slice(0,4).map(orderRow).join('')||'<p class="muted">No orders yet.</p>';
  return `${offlineBanner()}<div class="goalcard">${ring(s.p,plant(s.p,92))}<div class="meta"><span style="font-size:.87rem;color:#C5CBE0">${g.emoji} ${esc(g.title)}</span><h2 class="num">${Math.round(s.p*100)}% there</h2><div class="amt"><b class="num">${fmt(s.cur)}</b> of ${fmt(g.target)}</div>${stPill(s.st)}<p class="goalnote">${Math.round(s.mLeft)} months to go. Needs about ${fmt(s.need)} a month; you plan ${fmt(s.planned)}.</p></div></div>
  <div class="grid2"><button class="btn dark" data-act="add-open" data-x="${g.id}">${T('Add money')}</button><button class="btn soft" data-act="withdraw-open" data-x="${g.id}">${T('Withdraw')}</button></div>
  <div class="card line stack"><div class="row between"><h3>Where this could land</h3><span class="pill info">Illustrative</span></div>${projChart(pj,g.target)}<div class="legend"><span><i style="background:var(--mint)"></i>Expected</span><span><i style="background:var(--blue)"></i>Your target</span><span>Shaded: likely range</span></div><div class="grid2"><div><div class="fine">Pessimistic</div><b class="num">${fmt(endL)}</b></div><div><div class="fine">Expected</div><b class="num">${fmt(endE)}</b></div></div><div class="banner ${verdict.k==='good'?'info':verdict.k}">${verdict.t}</div><p class="fine">Assumes your current SIP continues. Ranges are not promises and real returns can be lower.</p></div>

  if(!S.flags.practice)return `<div class="card line stack" style="text-align:center;align-items:center"><span style="font-size:2.6rem">🧪</span><h2>Practice mode is switched off</h2><p class="muted">This is a feature flag in the PM console. Switch it on to see the paper portfolio.</p></div>`;
  const P=S.practice,tv=pValue(),pl=tv-10000,plp=pl/100,last3=P.trades.filter(t=>t.day>=S.day-3).length;

function tabLearn(){
  const d=S.learn.done.length,N=LESSONS.length;

function calcCompute(){
  const c=UI.calc,n=c.y*12,i=c.r/1200,fv=c.p*((Math.pow(1+i,n)-1)/i)*(1+i),inv=c.p*n,a=[],b=[];
  for(let y=0;y<=c.y;y++){const m=y*12;a.push(c.p*m);b.push(m?c.p*((Math.pow(1+i,m)-1)/i)*(1+i):0)}
  return{fv:fv,inv:inv,a:a,b:b};
}
function calcHTML(){
  const c=UI.calc,r=calcCompute();

function pmExp(){

  const res=r?`<div class="card line stack"><div class="row between"><h3>Simulated result</h3><span class="pill mute">Run ${S.stats.expRuns}</span></div><div class="sbar"><span class="lab">Control</span><span class="trk"><i style="width:${Math.min(100,r.pc*100*2)}%;background:var(--ink2)"></i></span><span class="val num">${(r.pc*100).toFixed(1)}%</span></div><div class="sbar"><span class="lab">Start</span><span class="trk"><i style="width:${Math.min(100,r.pt*100*2)}%;background:var(--mint)"></i></span><span class="val num">${(r.pt*100).toFixed(1)}%</span></div><div class="kv"><span>Lift</span><b class="num">${pct(r.diff*100,2)} pts</b></div><div class="kv"><span>95% interval</span><b class="num">${pct(r.lo*100,1)} to ${pct(r.hi*100,1)}</b></div><div class="kv"><span>p-value</span><b class="num">${r.p<.001?'<0.001':r.p.toFixed(3)}</b></div><div class="banner ${r.dec.k==='good'?'info':r.dec.k}">${r.dec.t}</div></div>`:'';

  return `<div class="card line"><div class="row between"><h3>Event log</h3><span class="pill mute">${S.events.length} total</span></div>${ev.map(e=>`<div class="log"><span class="num" style="width:44px;flex:none">Day ${e.day}</span><span style="min-width:0;word-break:break-word"><b>${esc(e.name)}</b> <span class="fine">${esc(JSON.stringify(e.props)).slice(0,70)}</span></span></div>`).join('')||'<p class="muted">No events yet.</p>'}</div><p class="fine">Analytics ${S.consent.analytics?'on':'off'}. With analytics off only order events are recorded.</p>`;
}

/* ================= notes ================= */
function notesHTML(){
  return `<span class="tag">Product case study prototype</span><h2>Groww Start</h2><p>A guided mode for 20 to 26 year olds who want to start investing but do not know where to begin.</p>
  <div class="box"><b>The problem</b><p style="margin-top:4px">Access is solved. New investors stall at "what do I buy?" and "can I afford to lose this?", and many never make a second investment.</p></div>
  <h3>What is in the product</h3><ul><li><b>Setup:</b> persona, KYC with explore-first, goal, risk profile, reasoned basket, UPI payment.</li><li><b>Money:</b> multiple goals, SIP with autopay consent, round-ups, payday plan, withdrawals with a calm pause.</li><li><b>Trust:</b> order status, costs, risk meter, help, tickets, privacy controls.</li><li><b>Care:</b> inbox with a weekly cap, badges for habits, money health score.</li><li><b>Reach:</b> Hindi (beta), text size, low-data mode.</li></ul>
  <h3>Design principles</h3><ul><li><b>Habit over activity.</b> Streaks count weeks invested, not trades.</li><li><b>Fewer choices first.</b> One basket per goal, picked with reasons.</li><li><b>Safe by default.</b> Risk capped at level 4 of 6.</li><li><b>Built for uneven income.</b> Skip, pause, grace weeks.</li><li><b>Explain every nudge.</b> Each shows why you see it.</li></ul>
  <h3>Try it in 90 seconds</h3><ol><li>Finish setup and make the first ₹100.</li><li>Set a SIP, turn on round-ups, add a second goal.</li><li>Tap Day at the top and jump a month ahead.</li><li>Open the dip nudge, then try to withdraw.</li><li>You, then PM console, to flip flags and inject failures.</li></ol>
  <div class="box"><b>Heads up</b><p style="margin-top:4px">All money, prices, KYC and returns are simulated. Not a real Groww product and not investment advice.</p></div>`;
}

  const r=document.documentElement;
  if(S.set.theme)r.setAttribute('data-theme',S.set.theme);else r.removeAttribute('data-theme');

  r.style.setProperty('--tz',S.set.size);r.lang=S.set.lang==='hi'?'hi':'en';

function subTitle(){
  const t=UI.sub.type;
  return {goal:()=>{const g=goalById(UI.sub.id);return g?g.emoji+' '+esc(g.title):'Goal'},activity:()=>T('Orders and statements'),inbox:()=>T('Notifications'),badges:()=>T('Achievements'),help:()=>T('Help and support'),prefs:'Notification preferences',display:()=>T('Display and language'),privacy:()=>T('Privacy and data')}[t];
}
function subBody(){

function render(){
  applySettings();
  const app=$('#app'),view=$('#view'),prev=view?view.scrollTop:0;
  const key=[S.step,UI.tab,UI.sub?UI.sub.type+(UI.sub.id||''):'',UI.lesson||'',UI.pmTab,UI.slide].join('|');
  let html='';
  if(S.step!=='done')html=onboardHTML();
  else if(UI.lesson)html=lessonHTML();
  else if(UI.sub&&UI.sub.type==='pm')html=pmHTML();
  else if(UI.sub){
    const tt=subTitle();
    html=subbar(typeof tt==='function'?tt():tt)+`<main class="view" id="view">${subBody()}</main>`+navbar();
  }else{
    const t={home:tabHome,goals:tabGoals,practice:tabPractice,learn:tabLearn,you:tabYou}[UI.tab]();
    html=topbar()+`<main class="view" id="view">${t}</main>`+navbar();

function renderLayer(){
  let h='';
  if(UI.sheet)h+=sheetHTML(UI.sheet);
  if(UI.confetti){const cols=['#00D09C','#4B5DFF','#F6B964','#FF7A80','#4DF0C4'];let c='';for(let i=0;i<34;i++)c+=`<i style="left:${Math.round(Math.random()*100)}%;background:${cols[i%5]};animation-delay:${(Math.random()*.6).toFixed(2)}s;animation-duration:${(2+Math.random()*1.4).toFixed(2)}s"></i>`;h+=`<div class="confetti" aria-hidden="true">${c}</div>`}
  if(UI.toast)h+=`<div class="toast" role="status">${esc(UI.toast)}</div>`;
  $('#layer').innerHTML=h;
}
function toast(msg){UI.toast=msg;renderLayer();clearTimeout(toast.t);toast.t=setTimeout(()=>{UI.toast=null;renderLayer()},2600)}
function openSheet(s){UI.sheet=s;renderLayer()}

/* ================= flows ================= */
function needKyc(){if(!kycDone()){openSheet({type:'kyc'});return true}return false}
function startNewGoal(typeId){
  S.flow='newgoal';S.step='goal';S.askMoney=!S.moneySet;S.askRisk=!S.profile.comfort;
  const t=typeId&&GOALS.find(x=>x.id===typeId);
  S.draft={goal:t?Object.assign({},t):null,basketId:null};
  UI.sheet=null;UI.sub=null;save();render();
}
function goNext(){
  const s=seq(),i=s.indexOf(S.step),nx=s[i+1];
  if(nx==='reco'){const d=S.draft.goal;S.draft.basketId=recommendFor(d.months,d.id).basket.id}
  if(nx)S.step=nx;
  save();render();
}
function openPay(kind,amount,label,ctx){UI.pay={kind:kind,amount:amount,label:label,ctx:ctx||{},state:'confirm'};openSheet({type:'pay'})}
function payConfirm(){
  const P=UI.pay;if(!P)return;
  if(S.inject.offline){P.state='failed';P.reason='You are offline. Check your connection and try again.';renderLayer();return}
  P.state='processing';renderLayer();
  setTimeout(()=>{
    S.stats.payTotal++;
    if(S.inject.upi){S.inject.upi=false;S.stats.payFail++;track('payment_failed',{kind:P.kind});P.state='failed';P.reason='Your bank declined the payment (demo). Try again or use another UPI app.';save();renderLayer();return}
    paySuccess(P);
  },1100);
}
function paySuccess(P){
  track('payment_ok',{kind:P.kind,amount:P.amount});
  if(P.kind==='first'){
    const d=S.draft.goal,g=createGoal(d,S.draft.basketId||recommendFor(d.months,d.id).basket.id);
    invest(g.id,S.first,'first');UI.lastGoal=g.id;S.step='success';S.draft={goal:null,basketId:null};
    UI.sheet=null;UI.pay=null;checkBadges();save();render();confetti();return;
  }
  if(P.kind==='add'||P.kind==='quick'){invest(P.ctx.goal,P.amount,'manual');toast(streak().n>1?'Invested. '+streak().n+'-week streak 🔥':'Invested. Units allot tomorrow.')}
  else if(P.kind==='multi'){P.ctx.al.forEach(a=>{if(a.amount>0)invest(a.goal,a.amount,'plan')});toast('Payday plan invested. Nice move.')}
  UI.pay=null;UI.sheet=null;checkBadges();save();render();
}
function openSip(gid){
  const g=goalById(gid)||focusGoal();if(!g)return;
  if(needKyc())return;
  UI.sipD={goalId:g.id,amount:g.sip.on?g.sip.amount:Math.max(100,Math.min(S.capacity,500)),start:7,step:1,agree:false};
  openSheet({type:'sip'});
}
function applySip(){
  const D=UI.sipD,g=goalById(D.goalId),was=g.sip.on;
  g.sip.amount=D.amount;g.sip.limit=Math.max(g.sip.limit||0,D.amount);
  if(!was){g.sip.on=true;g.sip.nextDay=S.day+D.start;g.sip.paused=false;g.sip.skipNext=false;track('sip_setup',{amount:D.amount,start:D.start,goal:g.type});track('mandate_approved',{limit:g.sip.limit})}
  else track('sip_edited',{amount:D.amount});
  UI.sipD=null;checkBadges();save();closeSheet();render();
  toast(was?'SIP updated.':'SIP set. First debit on '+dLabel(g.sip.nextDay)+'.');
}
function readNum(id){const el=$('#'+id);return el?+el.value:0}
function resetAll(){S=fresh();UI.tab='home';UI.sub=null;UI.lesson=null;UI.sheet=null;UI.pay=null;UI.wd=null;try{localStorage.removeItem(KEY)}catch(e){}render()}
function sheetCloseSmart(){
  if(UI.sheet&&UI.sheet.type==='term'&&UI.prevSheet){UI.sheet=UI.prevSheet;UI.prevSheet=null;renderLayer();return}
  UI.pay=null;closeSheet();
  if(UI.pendingDone){const id=UI.pendingDone;UI.pendingDone=null;UI.goalDone=null;openSheet({type:'goaldone',id:id})}
}
const setSub=t=>()=>{UI.sub={type:t};render()};

  'mplan-apply':()=>{
    allocPlan(S.capacity).forEach(a=>{const g=goalById(a.goal);if(g.sip.on){g.sip.amount=Math.max(100,a.amount);g.sip.limit=Math.max(g.sip.limit,g.sip.amount)}});
    track('plan_applied');save();closeSheet();render();toast('SIPs updated to the suggested split.');
  },
  'health-open':()=>openSheet({type:'health'}),
  'order-open':t=>openSheet({type:'order',id:t.dataset.x}),
  'term':t=>{UI.prevSheet=UI.sheet;openSheet({type:'term',id:t.dataset.x})},
  'ticket-open':()=>{UI.tcat=UI.tcat||'Payments';UI.prevSheet=null;openSheet({type:'ticket'})},
  'tcat':t=>{const el=$('#tmsg');if(el)UI.tmsg=el.value;UI.tcat=t.dataset.v;renderLayer()},
  'ticket-go':()=>{
    const m=(($('#tmsg')||{}).value||'').trim();if(m.length<5){toast('Add a few words so we can help.');return}
    S.tickets.unshift({id:uid(),day:S.day,cat:UI.tcat||'Payments',msg:m,status:'open'});track('ticket_created',{cat:UI.tcat});
    UI.tmsg='';notify('txn','Ticket received','We will reply within 1 working day.',{a:'help',x:''});save();closeSheet();render();toast('Ticket sent. We reply within 1 working day.');
  },
  'ref-open':()=>openSheet({type:'ref'}),
  'ref-copy':()=>{try{navigator.clipboard.writeText(refCode());toast('Code copied.')}catch(e){toast('Your code is '+refCode())}},
  'ref-share':()=>{
    const txt='Join me on Groww Start. Use my code '+refCode()+' (prototype).';
    S.ref.shared++;track('invite_shared');checkBadges();save();
    try{if(navigator.share){navigator.share({text:txt}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(txt)}}catch(e){}
    renderLayer();toast('Invite ready to share.');
  },
  'data-open':()=>openSheet({type:'data'}),
  'about':()=>openSheet({type:'about'}),
  'reset-ask':()=>openSheet({type:'reset'}),
  'reset-go':resetAll,
  'survey-pick':t=>{S.survey.score=+t.dataset.v;S.survey.done=true;track('confidence_score',{score:S.survey.score});save();render();toast('Thanks. That helps us make this better.')},
  'survey-dismiss':()=>{S.survey.dismissed=true;save();render()},
  'dip-dismiss':t=>{S.dipDismissed.push(t.dataset.x);save();render()},
  'go-practice':()=>{UI.tab='practice';UI.sub=null;render()},

  'p-open':t=>openSheet({type:'asset',id:t.dataset.id}),
  'pfill':t=>{$('#pamt').value=t.dataset.v},
  'p-buy':t=>{UI.pamt=readNum('pamt')||1000;const e=pTrade(t.dataset.id,'buy',UI.pamt);if(e){toast(e);return}closeSheet();render();toast('Bought with practice cash.')},
  'p-sell':t=>{UI.pamt=readNum('pamt')||1000;const e=pTrade(t.dataset.id,'sell',UI.pamt);if(e){toast(e);return}closeSheet();render();toast('Sold. Practice cash updated.')},
  'p-tick':()=>advance(1),

  'lesson-open':t=>{UI.lesson=t.dataset.x;UI.slide=0;UI.quizPick=null;render()},
  'lesson-dip':()=>{UI.lesson='dip';UI.slide=0;UI.quizPick=null;render()},
  'l-close':()=>{UI.lesson=null;render()},
  'l-next':()=>{UI.slide++;render();const o=$('.ob');if(o)o.scrollTop=0},
  'l-prev':()=>{UI.slide=Math.max(0,UI.slide-1);render()},
  'l-pick':t=>{UI.quizPick=+t.dataset.i;render()},
  'l-finish':()=>{const id=UI.lesson;if(S.learn.done.indexOf(id)<0){S.learn.done.push(id);S.learn.xp+=20;track('lesson_done',{id:id});checkBadges();save();toast('+20 XP')}UI.lesson=null;UI.tab='learn';UI.sub=null;render()},

  'theme':t=>{S.set.theme=t.dataset.v||null;save();render()},
  'size-set':t=>{S.set.size=+t.dataset.v;save();render()},
  'rm-toggle':()=>{S.set.rm=!S.set.rm;save();render()},
  'ld-toggle':()=>{S.set.ld=!S.set.ld;save();render()},
  'consent-toggle':t=>{const k=t.dataset.k;S.consent[k]=!S.consent[k];track('consent_changed',{k:k,on:S.consent[k]});save();render()},
  'np-toggle':t=>{const k=t.dataset.k;S.np[k]=S.np[k]===false;save();render()},
  'np-cap':t=>{S.np.cap=+t.dataset.v;save();render()},
  'flag-toggle':t=>{const k=t.dataset.k;S.flags[k]=!S.flags[k];track('flag_changed',{k:k,on:S.flags[k]});save();render()},
  'inject-toggle':t=>{const k=t.dataset.k;S.inject[k]=!S.inject[k];save();render()},
  'exp-power':t=>{UI.exp.power=+t.dataset.v;render()},
  'exp-breach':()=>{UI.exp.breach=!UI.exp.breach;render()},
  'exp-run':()=>{runExperiment();save();render()}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const f=H[t.dataset.act];if(f)f(t,e);
});
document.addEventListener('input',e=>{
  const el=e.target,k=el.dataset&&el.dataset.in;if(!k)return;const v=+el.value;
  if(k==='goal-target'){S.draft.goal.target=v;$('#o-t').textContent=fmt(v);save()}
  else if(k==='goal-months'){S.draft.goal.months=v;$('#o-m').textContent=v+' months';save()}
  else if(k==='edit-target'){UI.editG.target=v;$('#e-t').textContent=fmt(v)}
  else if(k==='edit-months'){UI.editG.months=v;$('#e-m').textContent=v}
  else if(k.indexOf('calc-')===0){
    UI.calc[k.slice(5)]=v;const r=calcCompute();
    $('#c-p').textContent=fmt(UI.calc.p);$('#c-y').textContent=UI.calc.y+' years';$('#c-r').textContent=UI.calc.r+'%';
    $('#c-inv').textContent=fmt(r.inv);$('#c-fv').textContent=fmt(r.fv);$('#c-chart').innerHTML=spark(r.b,{base:r.a,label:'Projected growth'});
  }
  else if(k==='plan-inc'||k==='plan-pct'){
    if(k==='plan-inc')UI.plan.income=el.value;else UI.plan.pct=v;
    const amt=planAmount(),al=allocPlan(amt);$('#plan-box').innerHTML=planRows(amt,al);$('#plan-pct-lab').textContent=UI.plan.pct+'%';
  }
  else if(k.indexOf('exp-')===0){
    const E=UI.exp;if(k==='exp-base')E.base=v;if(k==='exp-mde')E.mde=v;if(k==='exp-tr')E.traffic=v;if(k==='exp-lift')E.lift=v;
    const n=sampleSize(E.base/100,E.mde/100,E.power);
    $('#x-base').textContent=E.base+'%';$('#x-mde').textContent=E.mde+' pts';$('#x-tr').textContent=E.traffic;$('#x-lift').textContent=E.lift+' pts';
    $('#x-n').textContent=n.toLocaleString('en-IN');$('#x-d').textContent=Math.ceil(2*n/E.traffic)+' days';
  }
  else if(k==='gloss-q'){const q=el.value.trim().toLowerCase();document.querySelectorAll('#gloss details').forEach(d=>{d.hidden=!!q&&d.dataset.term.indexOf(q)<0})}
  else if(k==='faq-q'){const q=el.value.trim().toLowerCase();document.querySelectorAll('#faq details').forEach(d=>{d.hidden=!!q&&d.dataset.q.indexOf(q)<0})}
  else if(k==='sip-agree'){UI.sipD.agree=el.checked;const b=$('#sip-save');if(b)b.disabled=!el.checked}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.sheet)sheetCloseSmart()});

/* ================= boot ================= */
if(S.step==='success')S.step='done';
if((S.step==='reco'||S.step==='pay')&&!S.draft.goal)S.step='goal';
$('#notes').innerHTML=notesHTML();
render();
window.__gs={get S(){return S},UI:UI,H:H,advance:advance,tValue:tValue,streak:streak,health:health};
})();
</script>
</body>
</html>
